<app-side-bar></app-side-bar>
<div id="refsetDirectoryPage" class="container-fluid">
    <div
        class="row refset-title"
        style="
            align-items: baseline;
            position: sticky;
            top: 60px;
            z-index: 2;
            background-color: white;
            box-shadow: 0 4px 2px -2px gray;
        "
    >
        <div
            class="col-md-auto page-title"
            style="margin-right: 20px; color: #555555; padding-left: 60px"
        >
            Projects
        </div>
        <div
            class="row justify-content-end details-version-select"
            style="margin-left: 20px"
        >
            <mat-form-field appearance="fill">
                <mat-select
                    #detailsVersionSelect
                    [(value)]="selectedValue"
                    [disableOptionCentering]="true"
                >
                    <mat-option
                        *ngFor="let data of dummydata"
                        [value]="data"
                        style="z-index: 3"
                    >
                        {{ data }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>

    <!-- Page Title -->
    <div
        style="
            width: 100%;
            justify-content: space-between;
            display: flex;
            padding-right: 20px;
            align-items: baseline;
            padding-left: 265px;
        "
        [class.container-toggled]="toggleService.isToggled"
    >
        <div
            class="container-fluid page-title"
            style="display: inline; padding-left: 0px; color: rgb(0, 164, 228)"
        >
            Reference Sets
        </div>
        <div style="display: inline">
            <create-new-refset></create-new-refset>
        </div>
        <div style="display: inline; padding-left: 10px">
            <button
                mat-raised-button
                color="primary"
                aria-hidden="false"
                #createRefsetButton
                class="refset-tool-action-button"
                aria-label="Create New Refset"
                title="Create New Refset"
                ng-reflect-color="primary"
            >
                Bulk Refset Actions
            </button>
        </div>
    </div>

    <!-- Refset Table -->
    <div
        class="container-fluid"
        [class.container-toggled]="toggleService.isToggled"
        style="padding-left: 265px"
    >
        <ag-grid-angular
            #directoryTable
            class="
                ag-theme-alpine
                refset-tool-ag-grid refset-tool-ag-grid-filter
            "
            [columnDefs]="columnDefs"
            [gridOptions]="refsetGridOptions"
            style="width: 100%"
        >
        </ag-grid-angular>

        <!-- Name Templates -->
        <ng-template #directoryNameSection let-params>
            {{ params?.value }}
        </ng-template>
    </div>
</div>
