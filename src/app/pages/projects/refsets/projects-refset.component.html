<div class="rt2-container">
	<!-- Page Title -->
	<div *ngIf="selectedProject" class="w-100-pct jc-space-between d-flex align-center mb-10" [class.container-toggled]="toggleService.isToggled">
		<heading-with-count title="Reference Sets" [count]="numOfResults"></heading-with-count>
		<div class="d-flex w-100-pct jc-flex-e rt2-btn-group">
			<create-refset [disabled]="!selectedProject?.roles?.includes('AUTHOR') || !selectedProject" [inputProperties]="createRefsetProperties" [existingBranchVersions]="existingBranchVersions">
			</create-refset>
			<div [hidden]="refsetData?.length < 1">
				<app-refset-download [isDetailPage]="true" [refsets]="refsetData" [project]="selectedProject"></app-refset-download>
			</div>
			<div [hidden]="!selectedProject?.roles?.includes('AUTHOR') || refsetData?.length < 1">
				<bulk-upgrade-modal [project]="selectedProject" (processComplete)="onGridReady(originalGridParams)"></bulk-upgrade-modal>
			</div>
		</div>
	</div>

	<!-- Reference Set Table -->
	<div [class.container-toggled]="toggleService.isToggled">
		<ag-grid-angular #projectTable class="ag-theme-alpine rt2-ag-grid rt2-ag-grid-filter w-100-pct" [columnDefs]="columnDefs" [gridOptions]="refsetGridOptions"> </ag-grid-angular>

		<app-pagination
			#projectPaging
			[pageSize]="refsetGridPaging.pageSize"
			[gridOptions]="refsetGridOptions"
			[pageSizeOptions]="refsetGridPaging.pageSizeOptions"
			[totalKnown]="refsetGridPaging.totalKnown"
			[manualStateRefresh]="refsetGridPaging.manualStateRefresh"
			[isProjectsPage]="true">
		</app-pagination>

		<!-- Name Templates -->
		<ng-template #projectNameSection let-params>
			<div class="project-refset-name">
				{{ params?.value }}

				<mat-icon *ngIf="params?.data?.privateRefset" aria-hidden="false" #directoryPrivateIcon class="rt2-table-action-icon" aria-label="Private Reference Set" title="Private Reference Set">
					lock
				</mat-icon>
				<mat-icon *ngIf="params?.data?.localSet" aria-hidden="false" class="rt2-table-action-icon" aria-label="Local Set" title="Local Set"> my_location </mat-icon>
			</div>
		</ng-template>

		<!-- Workflow Status Templates -->
		<ng-template #projectWorkflowStatusSection let-params>
			<workflow-status-badge [status]="params?.data?.workflowStatus"> </workflow-status-badge>
		</ng-template>

		<!-- Action Templates -->
		<ng-template #projectActionSection let-params>
			<div class="d-flex rt2-wrap">
				<div class="row">
					<div class="col-6">
						<div class="library-app-refset-download">
							<app-refset-download [isDetailPage]="false" *ngIf="params?.data?.downloadable" [refset]="getRefsetRow(params.data.refsetId)"> </app-refset-download>
						</div>
					</div>

					<div class="col-6">
						<div class="library-app-refset-discussion-list">
							<app-refset-discussion-list
								*ngIf="params && params.data"
								type="REFSET"
								[refsetInternalId]="params.data.id"
								[refsetId]="params.data.refsetId"
								[refsetName]="params.data.name"
								[roles]="params.data.roles"
								[(discussionCount)]="params.data.openDiscussionCount">
							</app-refset-discussion-list>
						</div>
					</div>
				</div>
			</div>
		</ng-template>
	</div>
</div>

<scroll-top></scroll-top>

<ng-template #workflowDiagramDialog let-modal>
	<div class="modal-header review-modal-header">
		<h3 class="modal-title review-modal-title modal-header-font" id="modal-basic-title">Workflow Diagram</h3>
		<button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
			<span aria-hidden="true">&times;</span>
		</button>
	</div>
	<div class="modal-body review-modal-body">
		<img src="assets/wf-table.png" alt="Workflow Diagram" title="Workflow Diagram" aria-label="Workflow Diagram" class="mw-100-pct mh-100-pct" />
	</div>
</ng-template>
