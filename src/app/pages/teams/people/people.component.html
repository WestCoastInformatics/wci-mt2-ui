<div class="content-header">
    <div class="row header-title">

        <span class="title-label">Organizations</span>
        <mat-form-field floatLabel="never" appearance="legacy" class="project-drop-down">
            <mat-label>Choose Organization</mat-label>
            <mat-select #detailsVersionSelect [disableOptionCentering]="true" [(value)]="selectedOrganization" (selectionChange)="selectOrganization()">
                <mat-option *ngFor="let organization of organizationList" [value]="organization" class="z-index-3" [title]="organization.name">
                    {{ organization.name }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <span class="title-label">Teams</span>
        <mat-form-field floatLabel="never" appearance="legacy" class="project-drop-down">
            <mat-label>Choose Team</mat-label>
            <mat-select #detailsVersionSelect [disableOptionCentering]="true" [(value)]="selectedTeam" (selectionChange)="selectTeam()">
                <mat-option *ngIf="teamList == null || teamList.length == 0">No Teams</mat-option>
                <mat-option *ngFor="let team of teamList" [value]="team" class="z-index-3" [title]="team.name">
                    {{ team.name }}
                </mat-option>
            </mat-select>
        </mat-form-field>

    </div>
</div>

<div class="content-wrapper">

    <app-sidebar [menuItems]="menu" [id]="teamId"></app-sidebar>

    <div class='container-fluid mt-3'>
        <div class='row'>
            <div *ngIf="showLoadingSpinner" class="loading"></div>
            <div class='col-12'>
                <section class="mb-3">

                    <div class='section-header mb-4'>
                        People ({{dataCount}})
                        <add-member-modal *ngIf="selectedTeam && selectedTeam.userRoles?.includes('ADMIN')" type="Team" [id]="selectedTeam?.id" [name]="selectedTeam?.name" [users]="userList">
                        </add-member-modal>
                    </div>

                    <div class='dashboard-section'>
                        <div class="ag-theme-alpine">

                            <ag-grid-angular *ngIf="showTable" [columnDefs]="gridColumnDefs" [rowData]="data" (gridReady)="onGridReady($event)" [gridOptions]="gridOptions"
                              class="w-100-pct">
                            </ag-grid-angular>

                            <!-- Name Template -->
                            <ng-template #peopleNameSection let-params>
                                <img #iconImg [src]="uiUtility.prepareIconImage(iconImg, params?.data?.iconUri)" class="medium-icon-image" /> {{ params?.value}}
                            </ng-template>

                            <!-- Teams Template -->
                            <ng-template #peopleTeamsSection let-params>
                                <div class="d-flex jc-space-between w-160">
                                    <span class="text-primary font-weight-bold pointer" [title]="getTeamsTitle(params?.data)">
                                        {{getTeamsCount(params?.data)}} teams</span>
                                    <img *ngIf="selectedOrganization?.roles?.includes('ADMIN')"  src="assets/subtract-symbol-icon.svg" (click)="confirmRemoveUser(params?.data, $event)"
                                        width="30px" height="30px" title="Inactivate User" aria-label="Subtract" class="mt-10 subtract-symbol-icon"
                                            alt="Subtract symbol shown when you're able to remove a user" />
                                </div>
                            </ng-template>
                        </div>
                    </div>

                    <!-- <div class='text-right'>
                        <a class='text-muted light'>show/hide admin</a>
                    </div> -->

                </section>
            </div>
        </div>
    </div>

</div>

<ng-template #confirmInactiveMemberModal let-modal>

    <div class="modal-header rt2-modal-header">
        <button ngbAutofocus class="unfocus-btn"></button>
        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">Remove User Confirmation</h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>

    <div class="container-fluid ">
        <div class="modal-body">
            <div class="notes-title">Are you sure you want to remove "{{selectedUser.name}}" from the team?
            </div>
        </div>
    </div>

    <div class="modal-footer rt2-modal-footer">
        <button type="button" (click)="removeUser();" mat-raised-button class="rt2-action-button mat-red mr-2">Remove User
        </button>
        <button (click)="modal.dismiss()" mat-raised-button class="rt2-action-button default-btn">Cancel
        </button>
    </div>

</ng-template>
