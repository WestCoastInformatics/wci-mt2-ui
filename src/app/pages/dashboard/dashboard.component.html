<div class="content-header">
    <div class="row header-title">
        <span class="title-label dashboard-title">My Dashboard</span>
    </div>
</div>
<div class="content-wrapper">
    <div class='container-fluid mt-3'>
        <div class='row'>
            <div class='col-md-4 col-12'>
                <section>
                    <div class='section-header'>My Organizations</div>
                    <div class='dashboard-section'>
                        <div class="dashboard-section-mid">
                            <ng-container *ngFor="let organization of organizationList">
                                <div class='section-list' *ngIf="organization.name">
                                    <img #iconImg [src]="uiUtility.prepareIconImage(iconImg, organization.iconUri)" class="medium-icon-image" /> {{ params?.value}}
                                    <span [routerLink]="['/organizations/' + organization.id + '/edition/0/projects']"><a>{{
                                            organization.name }}</a></span>
                                </div>
                            </ng-container>
                        </div>
                        <div *ngIf="false && currentUser?.roles?.includes('all-all-admin')">
                            <create-new-organization-modal></create-new-organization-modal>
                        </div>
                    </div>
                </section>

                <section>
                    <div class='section-header'>My Projects</div>
                    <div class='dashboard-section'>
                        <div class="dashboard-section-mid">
                            <ng-container *ngFor="let project of projectList">
                                <div class='section-list' *ngIf="project.name">
                                    <span
                                      [routerLink]="['/organization/' + project.edition.organization.id + '/edition/' + project.edition.id + '/projects/' + project.id +'/refsets']"><a>{{
                                            project.edition.organization.name }}/{{
                                            project.name }}</a><i *ngIf="project.privateProject" class='fa fa-lock ml-2 text-muted'></i></span>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </section>

                <section>
                    <div class='section-header'>My Teams</div>
                    <div class='dashboard-section'>
                        <div class="dashboard-section-mid">
                            <ng-container *ngFor="let team of teamList">
                                <div class='section-list' *ngIf="team.name">
                                    <span [routerLink]="['/organization/' + team.organizationId + '/teams/' + team.id +'/people']"><a>{{
                                            team.organization?.name }}/{{ team?.name}}</a></span>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </section>
            </div>
            <div class='col-md-8 col-12'>
                <section>
                    <div class='section-header'>My Reference Sets</div>
                    <div class="ag-theme-alpine pr-2 pl-2">
                        <ag-grid-angular [columnDefs]="columnDefs" [gridOptions]="refsetGridOptions" style="width: 100%">
                        </ag-grid-angular>

                        <!-- Workflow Status Templates -->
                        <ng-template #dashboardWorkflowStatusSection let-params>
                            <workflow-status-badge [status]="params?.data?.workflowStatus">
                            </workflow-status-badge>
                        </ng-template>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
