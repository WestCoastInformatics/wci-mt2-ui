<div class="content-header">
    <div class="row header-title">
        <span class="title-label">{{ this.user?.name }}</span>
    </div>
</div>

    <div class="content-wrapper">
        <app-sidebar [menuItems]="menu"></app-sidebar>
        <div class='container-fluid mt-3'>
            <div class='row'>
                <div class='col-md-4 col-12'>
                    <section>
                        <div class='section-header'>About</div>
                        <div class='dashboard-section pr-2 pl-2'>
                            <div class="about-section">
                                <div><img class="landing-profile-pic" src="assets/ihtsdo.svg"></div>
                                <div class="about-name-section">{{ this.user?.name }}</div>
                                <div class="about-data-section">
                                    <div class="about-data-text">{{ this.user?.company }}</div>
                                    <div class="about-data-text">{{ this.user?.email }}</div>
                                    <div class="about-data-text">{{todayDate | date:'longTime'}}</div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
                <div class='col-md-8 col-12'>
                    <section>
                        <div class='section-header'>Organizations</div>
                        <div class='dashboard-section'>
                            <div class="dashboard-section-mid">
                                <ng-container *ngFor="let organization of organizationList">
                                    <div class='section-list' *ngIf="organization.value">
                                        <img [src]="organization.iconUri" />
                                        <span [routerLink]="['/organizations/projects', organization.id]"><a>{{ organization.value }}</a></span>
                                    </div>
                                    </ng-container>
                            </div>
                        </div>
                    </section>

                    <section>
                        <div class='section-header'>Teams</div>
                        <div class='dashboard-section'>
                            <div class="dashboard-section-mid">
                                <ng-container *ngFor="let team of teamList">
                                    <div class='section-list' *ngIf="team.name">
                                        <span [routerLink]="['/teams/people', team.id]"><a>{{ team.name }}</a></span>
                                    </div>
                                    </ng-container>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
    </div></div>
