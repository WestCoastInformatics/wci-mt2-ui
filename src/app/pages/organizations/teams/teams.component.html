<div class="section-header mb-10 d-flex">
	<heading-with-count title="Organization Teams" [count]="dataCount"></heading-with-count>
	<create-new-team-modal *ngIf="selectedOrganization && selectedOrganization.roles.includes('ADMIN')" [organization]="selectedOrganization"> </create-new-team-modal>
</div>
<div class="dashboard-section">
	<div class="ag-theme-alpine">
		<ag-grid-angular [columnDefs]="gridColumnDefs" [rowData]="data" (gridReady)="onGridReady($event)" [gridOptions]="gridOptions" class="w-100-pct"> </ag-grid-angular>
		<!-- description template -->
		<ng-template #descriptionSection let-params>
			<label class="ellipsed-label" container="body" placement="top" popoverTitle="Description">
				{{ params?.data.description }}
			</label>
		</ng-template>
		<!-- people template-->
		<ng-template #peopleSection let-params>
			<span class="text-primary font-weight-bold pointer">{{ params?.data?.members }} Users</span>
		</ng-template>
	</div>
</div>
