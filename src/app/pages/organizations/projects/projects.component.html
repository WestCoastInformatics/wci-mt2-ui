<div *ngIf="showLoadingSpinner" class="loading"></div>

<div class="section-header mb-10 d-flex">
	<heading-with-count title="Organization Projects" [count]="dataCount"></heading-with-count>
	<!-- Organization Projects ({{dataCount}}) -->
	<create-new-project-modal *ngIf="selectedOrganization && selectedOrganization.roles.includes('ADMIN') && selectedEdition" [edition]="selectedEdition"> </create-new-project-modal>
</div>
<div class="dashboard-section">
	<div class="ag-theme-alpine">
		<ag-grid-angular
			[columnDefs]="columnDefs"
			[rowData]="data"
			[gridOptions]="gridOptions"
			(gridReady)="onGridReady($event)"
			(cellClicked)="onGridCellClick($event)"
			[tooltipShowDelay]="0"
			class="w-100-pct">
		</ag-grid-angular>
	</div>
	<ng-template #descriptionSection let-params>
		<label class="ellipsed-label" container="body" placement="top" popoverTitle="Description">
			{{ params?.data.description }}
		</label>
	</ng-template>
	<ng-template #teamSection let-params>
		<span class="text-primary font-weight-bold pointer" *ngIf="getTeamsTitle(params?.data) !== 'No teams'" [title]="getTeamsTitle(params?.data)">{{ getTeamCount(params?.data) }} teams</span>
		<span *ngIf="getTeamsTitle(params?.data) === 'No teams'">Loading...</span>
	</ng-template>
</div>
