<div class="dialog-header accent-background">
    <!--<span class="dialog-header-title">{{ config.headerText }}</span>-->
    <div mat-dialog-title class="refset-tool-dialog-title">
        <div *ngIf="config.showTitle" id="{{ id }}Title">
            {{ config.headerText }}
        </div>

        <button *ngIf="config.showCloseIcon" mat-icon-button aria-hidden="false" aria-label="Close Dialog" (click)="cancel()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
</div>
<div mat-dialog-content class="refset-tool-dialog-content">

    <ng-container [ngTemplateOutlet]="config.template" [ngTemplateOutletContext]="{ $implicit: data }"></ng-container>
</div>

<div mat-dialog-actions class="refset-tool-dialog-actions" id="{{ id }}Actions">

    <button mat-raised-button color="primary" [hidden]="config.showConfirm === false" [style.background-color]="isDisabled ? 'grey' : '#00a9e0'"
      [style.cursor]="isDisabled ? 'default' : 'pointer'" id="{{ id }}Confirm" (click)="isDisabled ? '' : confirm() ">
        <mat-icon *ngIf="config.confirmIcon" role="img" class="refset-tool-dialog-confirm-icon mat-icon notranslate material-icons mat-icon-no-color" aria-hidden="true"
          data-mat-icon-type="font">
            {{ config.confirmIcon }}
        </mat-icon>
        {{ config.confirmText }}
    </button>

    <button mat-raised-button *ngIf="config.showCancel" id="{{ id }}Cancel" (click)="cancel()"
      class="refset-tool-action-button default-btn">
        <mat-icon *ngIf="config.cancelIcon" role="img" class="refset-tool-dialog-cancel-icon mat-icon notranslate material-icons mat-icon-no-color" aria-hidden="true"
          data-mat-icon-type="font">
            {{ config.cancelIcon }}
        </mat-icon>
        {{ config.cancelText }}
    </button>

    <button mat-raised-button color="green" [hidden]="config.showAction != true" [style.background-color]="isDisabled ? 'grey' : '#4ea24e'"
      [style.cursor]="isDisabled ? 'default' : 'pointer'" id="{{ id }}Action" (click)="isDisabled ? '' : confirm() ">

        {{ config.actionText }}
    </button>
</div>
