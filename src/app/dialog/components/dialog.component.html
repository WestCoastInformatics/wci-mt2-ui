<h1 *ngIf="config.showTitle" mat-dialog-title id="{{id}}Title"> {{config.headerText}}</h1>
<button *ngIf="config.showCloseIcon" mat-icon-button class="refset-tool-close-button" aria-hidden="false"
    aria-label="Close Dialog" [mat-dialog-close]="true">
    <mat-icon>close</mat-icon>
</button>

<div mat-dialog-content>
    <ng-container [ngTemplateOutlet]="config.template" [ngTemplateOutletContext]="{$implicit: data}"></ng-container>
</div>

<div mat-dialog-actions id="{{id}}Actions">
    <button mat-raised-button *ngIf="config.showCancel" id="{{id}}Cancel" mat-button
        (click)="cancel()">{{config.cancelText}}</button>
    <button mat-raised-button color="primary" id="{{id}}Confirm" (click)="confirm()">
        <span class="mat-button-wrapper">
        <mat-icon role="img" aria-hidden="true" data-mat-icon-type="font" class="mat-icon notranslate material-icons mat-icon-no-color">download</mat-icon></span>{{config.confirmText}}</button>
</div>
