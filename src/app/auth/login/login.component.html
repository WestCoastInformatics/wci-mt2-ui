<div class="login-main">
    <div class="title text-center mt-3">
        <h3>Sign in to Snomed Refset</h3>
    </div>
    <div class="title text-center mt-3">
        <div class="form-group">
            <a href='https://dev-ims.ihtsdotools.org/#/login?serviceReferer=http%3A%2F%2Flocalhost%3A4200%2Flogin' class="btn btn-primary">Sign In</a>
        </div>
    </div>
    <div class="login-box">
        <div class="login-form mt-3">
            <div class="form-inner">
                <div class="form-group">
                    <label>Username (email address)</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Username (email address)" [(ngModel)]="userName">
                </div>
                <div class="form-group">
                    <div class="d-flex justify-content-between">
                        <label>Password</label>
                    </div>
                    <input type="password" class="form-control form-control-sm" placeholder="Password" [(ngModel)]="password">
                </div>
                <div class="form-group">
                    <button class="btn btn-sm form-control form-control-sm btn-success" style="background: #434955 !important" (click)="onSubmit()">Sign in</button>
                </div>
            </div>
        </div>
    </div>

</div>
