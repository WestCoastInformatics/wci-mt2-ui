<div class="sidebar">
	<div class="wrapper">
		<ul>
			<ng-container *ngFor="let item of menuItems">
				<li [class.active]="item.isActive" (mouseenter)="onMouseEnter($event.target)" (mouseleave)="onMouseOut($event.target)">
					<a [routerLink]="" (click)="goToLink(item.link)">
						<i class="sidebar-icon-font" [class]="item.icon"></i>
						<span class="nav-label sidebar-links-font">{{ item.name }}</span>
					</a>
				</li>
			</ng-container>
		</ul>
	</div>
</div>
