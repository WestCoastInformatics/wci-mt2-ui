<div class='sidebar'>
	<div class="wrapper">
		<ul>
			<ng-container *ngFor="let item of menuItems">
				<li [class.active]="item.isActive">
					<a [routerLink]="getLink(item.link)">
						<i class="{{item.icon}}"></i>
						<span class="nav-label">{{item.name}}</span>
					</a>
				</li>
			</ng-container>
		</ul>
	</div>
</div>
