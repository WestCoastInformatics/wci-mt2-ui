<div class='sidebar'>
  <div class="wrapper">
      <ul>
          <ng-cotainer *ngFor="let item of menuItems">
            <li [class.active]="item.isActive">
                <a [routerLink]="item.link">
                    <i class="{{item.icon}}"></i>
                    <span class="nav-label">{{item.name}}</span>
                </a>
            </li>
          </ng-cotainer>
      </ul>
  </div>
</div>
