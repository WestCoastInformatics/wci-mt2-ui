<mat-form-field floatLabel="never" appearance="fill" class="category-filter-select">
	<mat-select [(value)]="selectedOption" [placeholder]="placeholder" (selectionChange)="valueChanged()">
		<mat-option *ngFor="let option of options" [value]="option">
			{{ option.label }}
		</mat-option>
	</mat-select>
</mat-form-field>
