<mat-menu #columnChooser="matMenu" class="menu">
	<div class="heading">TABLE SETTINGS</div>
	COLUMNS (Show/Hide)
	<mat-checkbox
		class="menu-checkbox"
		*ngFor="let column of columns; let i = index"
		[(ngModel)]="column.show"
		(click)="$event.stopPropagation()"
		(change)="selectColumns()"
		[disabled]="selectedColumns.length === 1 && column.show"
	>
		{{ column.name }}
	</mat-checkbox>
</mat-menu>

<div class="menu-inline">
	<button [matMenuTriggerFor]="columnChooser" aria-label="Settings" title="Settings" class="mapset-download-icon menu-button">
		<mat-icon class="menu-icon">settings</mat-icon>
		<span class="menu-label">Settings</span>
	</button>
</div>
