<button class="rt2-picklist-btn" (click)="openModal(formDialog)" title="Request Access" aria-label="Request Access"
        *ngIf="canRequest">
    Request Access
</button>

<ng-template #formDialog let-modal>
    <div class="modal-header rt2-modal-header">
        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
            Request Project Access
        </h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="modal-body rt2-lockable">
        <label class="modal-label-description">
            Request access to the underlying project for "{{this.refset?.name}}" which is
            "{{this.refset?.project?.name}}"
        </label>
        <table>

            <tr>
                <td>
                    <label class="modal-label-description">* Message:</label>
                </td>
                <td>
                    <mat-form-field floatLabel="never" class="import-from-list-field placeholder-wrap" appearance="legacy">
                            <textarea matInput
                                      placeholder="Please include a short explanation to accompany your request"
                                      class="import-from-list-text-area" [(ngModel)]="description"></textarea>
                    </mat-form-field>
                </td>
            </tr>
        </table>

    </div>
    <div class="modal-footer rt2-modal-footer rt2-lockable">
        <button type="button" [disabled]="description === ''" (click)="sendRequest()"
                aria-hidden="false" class="rt2-btn rt2-next-back-btn"
                aria-label="Send Email" title="Send Email">
            Send Email
        </button>
        <button type="button" (click)="modal.dismiss('Cross click')" aria-hidden="false" 
          class="ml-3 rt2-btn rt2-cancel-btn" aria-label="Cancel" title="Cancel">
            Cancel
        </button>
    </div>
</ng-template>
