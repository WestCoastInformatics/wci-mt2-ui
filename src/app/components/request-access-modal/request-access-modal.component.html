<button mat-menu-item (click)="openModal(formDialog)" title="Request Access" aria-label="Request Access"
    *ngIf="canRequest">
    Request Access</button>

<ng-template #formDialog let-modal>
    <div class="modal-header rt2-modal-header">
        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
            Request Project Access
        </h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="container-fluid ready-for-review-container-fluid" [formGroup]="form" *ngIf="form">
        <div class="modal-body pr-0 pl-0 pb-0">
            <div class="topic-header     mb-3" [innerHT ML]="modalTitle"></div>
            <div class="topic-content mb-3">
                <mat-form-field appearance="fill" class="discussion-topic-field">
                    <mat-label>Message</mat-label>
                    <textarea matInput formControlName="additionalMessage"
                              placeholder="Please include a short explanation to accompany your request" ></textarea>
                    <mat-error>
                        <ngx-form-error [control]="form.get('additionalMessage')"></ngx-form-error>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
    </div>
    <div class="modal-footer rt2-modal-footer">
        <button mat-raised-button aria-hidden="false" class="refset-tool-action-button refset-action-button default-btn mr-3" (click)="modal.dismiss('Cross click');">
            Cancel
        </button>
        <button mat-raised-button color="primary" aria-hidden="false" [disabled]="!form.valid" class="refset-tool-action-button refset-action-button" (click)="onSave()">
            Send Email
        </button>
    </div>
</ng-template>
