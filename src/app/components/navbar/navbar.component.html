<nav class="navbar sticky-top navbar-dark bg-dark pt-0 pr-2 row" style="justify-content: center; padding-bottom: 0 !important;">

    <div class="refset-tool-nav-item-row">

        <a class="refset-tool-nav-logo-section" routerLink="/dashboard" title="Reference Set Tool Home" aria-label="Reference set tool home">
            <img class="refset-tool-logo mr-2 p-0" src="/assets/small_logo.png">
            <span class="title text-ghost-grey refset-tool-nav-title">Reference Set Tool
                <b>(BETA)</b></span>
        </a>

        <div class="refset-tool-breadcrumb-bar text-ghost-grey">
            <div *ngFor="let breadcrumb of breadcrumbs" title="{{breadcrumb.label}}" aria-label="{{breadcrumb.label}}" [class]="breadcrumb.class"
              (click)="navigate(breadcrumb.id)">
                {{breadcrumb.label}}
            </div>
        </div>

        <ng-container [ngSwitch]="environment">
            <div *ngSwitchCase="'local'" class="banner text-white local"></div>
            <div *ngSwitchCase="'dev'" class="banner text-white dev"></div>
            <div *ngSwitchCase="'uat'" class="banner text-white uat"></div>
            <div *ngSwitchCase="'training'" class="banner text-white training"></div>
            <div *ngSwitchDefault class="banner text-white d-none"></div>
        </ng-container>

    </div>

    <div class="left-title-buttons">
        <div class="project-role-and-assignee-label" *ngIf="showProjectRoleAndAssignee()">
            <span class="project-role" *ngIf="showProjectRole()">Project Role: {{projectRole}}</span>
            <span class="project-role" *ngIf="showRefsetRole()">Role: {{refsetRole}}</span>
            <span class="project-assignee" *ngIf="assignedUser() != 'Unassigned'">Assignee: {{ assignedUser() }}</span>
        </div>

        <div class="directory-nav" (click)="navigateToRoute('/library')">
            <img class="directory-icon" src="/assets/directory-icon.svg">
            <span class="directory-icon-label">Library</span>
        </div>

        <div *ngIf="isUserLoggedIn" class="project-nav" (click)="navigateToRoute('/organization/0/edition/0/projects/0/refsets')">
            <img class="projects-icon" src="/assets/projects-icon.svg">
            <span class="projects-icon-label">Projects</span>
        </div>

        <div *ngIf="isUserLoggedIn" class="nav-item" (click)="navigateToRoute('/dashboard')">
            <img class="nav-icon dashboard-icon" src="/assets/dashboard-icon.svg">
            <span class="nav-label dashboard-icon-label">Dashboard</span>
        </div>

        <div *ngIf="isUserLoggedIn" class="float-right mr-2">
            <div class="dropdown" id="userDropdownMenu">

                <label class="dropdown-toggle pointer text-ghost-grey btn-sm mb-0" id="userDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <img #iconImg [src]="uiUtility.prepareIconImage(iconImg, user?.iconUri)" class="medium-icon-image mr-2" />
                </label>

                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                    <div class="dropdown-item pl-3" routerLink="/personal/{{user?.id}}/landing">
                        <div class="d-flex pointer">
                            <img #iconImg [src]="uiUtility.prepareIconImage(iconImg, user?.iconUri)" class="medium-icon-image mr-2" />

                            <div class="profile-block">
                                <strong>{{user.userName}}</strong>
                                <div class="text-sm-left">{{user.company}}</div>
                            </div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item text-center" href="#" (click)="resources()">Resources</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item text-center" href="#" (click)="logoutUser()">Logout</a>
                </div>
            </div>
        </div>

        <div *ngIf="!isUserLoggedIn" class="float-right mx-3">
            <!-- <div class="user d-inline-block m-2">
                <span class="px-2 text-ghost-grey">{{guestUser}}</span>
            </div> -->
            <div class="logout d-inline-block m-2" (click)="login()">
                <span class="px-2 text-ghost-grey">Login</span>
            </div>
        </div>
    </div>
</nav>
