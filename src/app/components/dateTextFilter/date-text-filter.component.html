<div class="date-selector">
  <input type="text" pattern="\d{4}-\d{2}-\d{2}" (dblclick)="picker.open()" [(ngModel)]="value" (ngModelChange)="valueChanged(false)" class="category-filter-select"
    placeholder="YYYY-MM-DD" />
  <mat-form-field appearance="fill">
    <input matInput [matDatepicker]="picker" (dateChange)="valueChanged(true, $event, picker)">
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
</div>
