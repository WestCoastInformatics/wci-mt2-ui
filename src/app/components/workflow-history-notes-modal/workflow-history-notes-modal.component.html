<div>
  <span class="float-right" title="Edit Note"><a *ngIf="edit" class="pointer" (click)="openReadyForReviewModal()">
    <mat-icon>edit</mat-icon>
  </a></span>
  <span *ngIf="edit" [innerHTML]="workflowHistoryNotes"></span>
</div>
<button *ngIf="!edit" class="rt2-picklist-btn" alt="Edit Notes" title="Edit Notes" aria-label="Edit Workflow History" [disabled]="disabled" (click)="openReadyForReviewModal()">Create Note</button>

<ng-template #modalContent>
    <div class="compose-modal-body">
        <editor class="fill-height" #workflowHistoryNotesEditor id="workflowHistoryNotesEditor" [(ngModel)]="workflowHistoryNotes" [init]="{
                base_url: '/tinymce',
                suffix: '.min',
                height: 200,
                menubar: false,
                auto_focus: 'workflowHistoryNotesEditor',
                placeholder: 'Enter your notes' ,
                plugins: ['lists advlist wordcount'],
          toolbar: 'undo redo | bold italic | bullist numlist outdent indent | wordcount' }">
        </editor>
    </div>
    <div class="modal-footer rt2-modal-footer">
        <button type="button" (click)="saveNotes(modal)" color="green" aria-hidden="false" class="rt2-btn rt2-next-back-btn"
          aria-label="Save" title="Save Notes">
            Save
        </button>
    </div>
</ng-template>
