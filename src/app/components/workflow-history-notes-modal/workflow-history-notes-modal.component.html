<button mat-menu-item alt="Edit Notes" title="Edit Notes" aria-label="Edit Workflow History" [disabled]="disabled" (click)="openreadyForReviewModal(workflowHistoryNotesDialog)">Create Note</button>


<ng-template #workflowHistoryNotesDialog
             let-modal>
    <div class="modal-header rt2-modal-header">
        <h4 class="modal-title rt2-modal-title"
            id="modal-basic-title">
            {{ title }}
        </h4>
        <button type="button"
                class="close dialog-close-x"
                aria-label="Close"
                (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="container-fluid workflow-history-notes-container-fluid">
        <div class="modal-body workflow-history-notes-modal-body">
            <editor #workflowHistoryNotesEditor
                    id="workflowHistoryNotesEditor"
                    [(ngModel)]="workflowHistoryNotes"
                    [init]="{
                    base_url: '/tinymce',
                    suffix: '.min',
                    height: 200,
                    menubar: false,
                    placeholder: 'Enter your notes',
                    plugins: ['lists advlist wordcount'],
                    toolbar:
                        'undo redo | bold italic | bullist numlist outdent indent | wordcount'
                }"></editor>
        </div>
    </div>
    <div class="modal-footer rt2-modal-footer">
        <button type="button"
                (click)="saveNotes(modal)"
                mat-raised-button
                color="green"
                aria-hidden="false"
                class="refset-tool-action-button request-review-modal-button"
                aria-label="Save"
                title="Save Notes"
                ng-reflect-color="green">
            Save
        </button>
    </div>
</ng-template>
