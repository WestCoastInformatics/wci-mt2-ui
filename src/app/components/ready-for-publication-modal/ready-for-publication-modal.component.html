<button
	#readyForPublicationButton
	(click)="openreadyForPublicationModal(readyForPublicationDialog)"
	color="primary"
	aria-hidden="false"
	#finishEditButton
	class="rt2-btn rt2-action-btn"
	attr.aria-label="{{ labelPrefix }} Request Publication"
	title="{{ labelPrefix }} Request Publication">
	{{ labelPrefix }} Request Publication
</button>

<ng-template #readyForPublicationDialog let-modal>
	<div class="modal-header rt2-modal-header">
		<button ngbAutofocus class="unfocus-btn"></button>
		<h3 class="modal-title rt2-modal-title modal-header-font" id="modal-basic-title">Ready for Publication</h3>
		<button type="button" class="close dialog-close-x close-icon-font" aria-label="Close" (click)="modal.dismiss('Cross click')">
			<span aria-hidden="true" class="dialog-close-x close-icon-font">&times;</span>
		</button>
	</div>
	<div class="modal-body">
		<div class="notes-title">Notes: <span class="mandatory-field">*</span></div>
		<editor
			[(ngModel)]="requestForPublicationNotes"
			id="notesTitles"
			[init]="{
				base_url: '/tinymce',
				suffix: '.min',
				height: 200,
				auto_focus: 'notesTitles',
				menubar: false,
				placeholder: 'Notes for consideration.',
				plugins: ['lists advlist'],
				toolbar: 'undo redo | bold italic | bullist numlist outdent indent'
			}"></editor>
	</div>
	<div class="modal-footer rt2-modal-footer">
		<button
			type="button"
			[disabled]="!requestForPublicationNotes"
			(click)="setWorkflowStatusByAction(requestForPublicationNotes)"
			color="green"
			aria-hidden="false"
			class="rt2-btn rt2-next-back-btn"
			aria-label="Request Publication"
			title="Request Publication">
			Request Publication
		</button>
	</div>
</ng-template>
