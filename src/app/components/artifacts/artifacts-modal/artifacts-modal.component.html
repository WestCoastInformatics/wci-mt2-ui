<button *ngIf="!isDetails" #artifactsButton mat-raised-button color="primary" aria-hidden="false" (click)="openArtifactsModal(artifactsDialog)"
  class="refset-tool-action-button refset-action-button" aria-label="Artifacts" title="Artifacts" ng-reflect-color="primary">
    Artifacts
</button>
<button mat-menu-item *ngIf="isDetails" (click)="openArtifactsModal(artifactsDialog)" title="Open Artifacts List" aria-label="Artifacts">Artifacts</button>

<ng-template #artifactsDialog let-modal>
    <div class="modal-header rt2-modal-header">
        <button ngbAutofocus class="unfocus-btn"></button>

        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
            Artifacts
        </h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="container-fluid ready-for-review-container-fluid">
        <div class="modal-body pr-0 pl-0 pb-0">

            <div class="text-right" *ngIf="canAdd">
                <artifact-form [refsetInternalId]="refsetInternalId" (refresh)="onRefresh(artifactsList)"></artifact-form>
            </div>

            <artifacts-list [refsetInternalId]="refsetInternalId" [refset]="refset" #artifactsList></artifacts-list>
        </div>
    </div>
    <div class="modal-footer rt2-modal-footer">
        <button mat-raised-button aria-hidden="false" class="refset-tool-action-button refset-action-button mr-3 default-btn" (click)="modal.dismiss('Cross click');">
            Close
        </button>
        <!--<button mat-raised-button color="primary" aria-hidden="false"
            class="refset-tool-action-button refset-action-button" ng-reflect-color="primary">
            Download
            <i class="fa fa-download"></i>
        </button>-->
    </div>
</ng-template>
