<a class="btn btn-main mb-3" (click)="openArtifactsModal(artifactFormDialog)" *ngIf="!isEdit && loaded">Add an artifact</a>
<a class="pointer ml-3" (click)="openArtifactsModal(artifactFormDialog)" *ngIf="isEdit && loaded">
    <mat-icon>edit</mat-icon>
</a>

<ng-template #artifactFormDialog let-modal>
    <div class="modal-header rt2-modal-header">
        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
            {{modalTitle}}
        </h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="container-fluid ready-for-review-container-fluid">
        <div class="modal-body pr-0 pl-0 pb-0">
            <div class="topic-content mb-3">
                <mat-form-field appearance="fill" class="discussion-topic-field">
                    <mat-label>Description</mat-label>
                    <input matInput type="text" [(ngModel)]="artifact.description"
                        placeholder="Add a Description for the artifact" />
                </mat-form-field>
            </div>
            <div class="topic-content mb-3" *ngIf="artifact.fileName">
                <mat-form-field appearance="fill" class="discussion-topic-field">
                    <mat-label>Artifact Name</mat-label>
                    <input matInput type="text" [(ngModel)]="artifact.fileName"
                        placeholder="Add a name for the artifact" readonly />
                </mat-form-field>
            </div>
            <div class="container-file-import w-100" dragAndDrop (fileDropped)="fileChange($event)" *ngIf="!isEdit">
                <input type="file" #fileDropRef id="fileDropRef" (click)="$event.target.value = null" (change)="fileChange($event)" />
                <img src="assets/import-file-upload-icon2.svg" title="Choose Artifact File" aria-label="Choose Artifact File" />

                <h3>Drag and drop file here</h3>
                <h3>or</h3>

                <label for="fileDropRef" class="import-from-file-drop-down-label">Browse for file</label>
            </div>
        </div>
    </div>
    <div class="modal-footer rt2-modal-footer">
        <button mat-raised-button aria-hidden="false"
            class="refset-tool-action-button refset-action-button mr-3 default-btn"
            (click)="modal.dismiss('Cross click');">
            Cancel
        </button>
        <button mat-raised-button color="red" aria-hidden="false" *ngIf="isEdit"
                class="refset-tool-action-button refset-action-button mr-3"
                (click)="confirmDelete()"
                ng-reflect-color="red">
            Delete
        </button>
        <button mat-raised-button color="primary" aria-hidden="false"
            class="refset-tool-action-button refset-action-button"
            ng-reflect-color="primary" (click)="onSave()">
            Save
        </button>
    </div>
</ng-template>

<ng-template #confirmDeleteModal let-modal>

    <div class="modal-header rt2-modal-header">
        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">Delete Artifact Confirmation</h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>

    <div *ngIf="isEdit" class="container-fluid ">
        <div class="modal-body">
            <div class="notes-title">Are you sure you want to delete this artifact "{{artifact.fileName}}"?</div>
        </div>
    </div>

    <div class="modal-footer rt2-modal-footer">
        <button type="button" (click)="deleteArtifact();" mat-raised-button class="refset-tool-action-button mat-red mr-2">Delete Artifact</button>
        <button (click)="modal.dismiss()" mat-raised-button class="refset-tool-action-button mat-primary">Cancel</button>
    </div>

</ng-template>
