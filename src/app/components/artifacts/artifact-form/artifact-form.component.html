<button class="rt2-btn rt2-action-btn mb-2" (click)="openArtifactsModal(artifactFormDialog)" *ngIf="!isEdit && loaded" title="Add artifact">Add An Artifact</button>
<a class="pointer ml-3" (click)="openArtifactsModal(artifactFormDialog)" *ngIf="isEdit && loaded" title="Edit artifact">
	<mat-icon>edit</mat-icon>
</a>

<ng-template #artifactFormDialog let-modal>
	<div class="modal-header rt2-modal-header">
		<h3 class="modal-title rt2-modal-title modal-header-font" id="modal-basic-title">
			{{ modalTitle }}
		</h3>
		<button type="button" class="close dialog-close-x close-icon-font" aria-label="Close" (click)="modal.dismiss('Cross click')">
			<span aria-hidden="true" class="dialog-close-x close-icon-font">&times;</span>
		</button>
	</div>
	<div class="modal-body">
		<div class="topic-content mb-3">
			<mat-form-field floatLabel="never" appearance="fill" class="discussion-topic-field">
				<mat-label>Description</mat-label>
				<input matInput type="text" [(ngModel)]="artifact.description" ngbAutofocus placeholder="Add a Description for the artifact" />
			</mat-form-field>
		</div>
		<div class="topic-content mb-3" *ngIf="artifact.fileName">
			<mat-form-field floatLabel="never" appearance="fill" class="discussion-topic-field">
				<mat-label>Artifact Name</mat-label>
				<input matInput type="text" [(ngModel)]="artifact.fileName" placeholder="Add a name for the artifact" readonly />
			</mat-form-field>
		</div>
		<div class="container-file-import w-100" dragAndDrop (fileDropped)="fileChange($event)" *ngIf="!isEdit">
			<input type="file" #fileDropRef id="fileDropRef" (click)="$event.target.value = null" (change)="fileChange($event)" />
			<img src="assets/import-file-upload-icon2.svg" title="Choose Artifact File" aria-label="Choose Artifact File" />

			<h3 class="general-icon-font">Drag and drop file here</h3>
			<h3 class="general-icon-font">or</h3>

			<label for="fileDropRef" class="import-from-file-drop-down-label">Browse for file</label>
		</div>
	</div>
	<div class="modal-footer rt2-modal-footer">
		<button aria-hidden="false" *ngIf="isEdit" class="rt2-btn rt2-remove-btn mr-3" (click)="confirmDelete()">Delete</button>
		<button color="primary" aria-hidden="false" class="rt2-btn rt2-next-back-btn mr-3" (click)="onSave()">Save</button>
		<button aria-hidden="false" class="rt2-btn rt2-cancel-btn" (click)="modal.dismiss('Cross click')">Cancel</button>
	</div>
</ng-template>

<ng-template #confirmDeleteModal let-modal>
	<div class="modal-header rt2-modal-header">
		<h3 class="modal-title rt2-modal-title modal-header-font" id="modal-basic-title">Delete Artifact Confirmation</h3>
		<button type="button" class="close dialog-close-x close-icon-font" aria-label="Close" (click)="modal.dismiss('Cross click')">
			<span aria-hidden="true" class="dialog-close-x close-icon-font">&times;</span>
		</button>
	</div>

	<div *ngIf="isEdit" class="container-fluid">
		<div class="modal-body">
			<div class="notes-title">Are you sure you want to delete this artifact "{{ artifact.fileName }}"?</div>
		</div>
	</div>

	<div class="modal-footer rt2-modal-footer">
		<button type="button" (click)="deleteArtifact()" class="rt2-btn rt2-action-btn mr-2">Delete Artifact</button>
		<button (click)="modal.dismiss()" class="rt2-btn rt2-cancel-btn">Cancel</button>
	</div>
</ng-template>
