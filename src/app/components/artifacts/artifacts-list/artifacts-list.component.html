<div class='dashboard-section pr-1 pl-1'>
    <div class="ag-theme-alpine">
        <ag-grid-angular [columnDefs]="columnDefs" [rowData]="data"
            class="ag-theme-alpine refset-tool-ag-grid refset-tool-ag-grid-filter w-100" [gridOptions]="gridOptions" (gridReady)="onGridReady">
        </ag-grid-angular>

        <ng-template #descriptionSection let-params>
            <label class="ellipsed-label" [ngbPopover]="params?.data.description" container="body" placement="top"
                popoverTitle="Description">
                {{ params?.data.description }}
            </label>
        </ng-template>
    </div>
</div>
