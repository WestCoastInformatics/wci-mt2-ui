<button
    #importFromFileButton
    (click)="openImportFromListModal(importFromListDialog)"
    style="
        width: 39px;
        height: 31px;
        box-sizing: border-box;
        border-width: 1px;
        border-style: solid;
        border-color: rgba(0, 164, 228, 1);
        background-color: rgba(255, 255, 255, 1);
    "
>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 0 24 24"
        width="24px"
        fill="rgba(0, 164, 228, 1)"
    >
        <path d="M0 0h24v24H0V0z" fill="none" />
        <path
            d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"
        />
    </svg>
</button>

<div *ngIf="showLoadingSpinner" class="loading">Loading&#8230;</div>

<ng-template #importFromListDialog let-modal>
    <div
        class="modal-header"
        style="border: none; padding-left: 30px; padding-bottom: 30px"
    >
        <h4
            class="modal-title"
            id="modal-basic-title"
            style="
                color: #9b9b9b;
                font-size: 1.5em;
                font-family: 'museo', 'Open Sans', 'Helvetica Neue', Helvetica,
                    Arial, sans serif;
            "
        >
            Add or Remove Members By List
        </h4>
        <button
            type="button"
            class="close"
            aria-label="Close"
            (click)="modal.dismiss('Cross click')"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div
        class="container-fluid"
        style="padding: 30px; padding-bottom: 0px; padding-top: 0px"
    >
        <div
            class="modal-body"
            style="
                background-color: rgba(245, 245, 246, 1);
                padding: 28px;
                border-radius: 5px;
                font-size: 14px;
                text-align: center;
                text-align: -webkit-center;
            "
        >
            <div
                style="
                    width: 300px;
                    text-align: left;
                    font-size: 13px;
                    padding-bottom: 20px;
                "
            >
                Enter a list of member IDs. Use a comma or whitespace delimited
                numeric identifiers.
            </div>
            <mat-form-field
                class="add-by-list-text-area"
                appearance="outline"
                style="width: 300px"
            >
                <textarea
                    matInput
                    style="height: 250px"
                    [(ngModel)]="listOfIds"
                ></textarea>
            </mat-form-field>
        </div>
    </div>
    <div class="modal-footer" style="border: none; padding: 30px">
        <button
            type="button"
            (click)="modal.close('Add Members'); addMembers()"
            mat-raised-button
            color="primary"
            aria-hidden="false"
            class="refset-tool-action-button"
            aria-label="Add Members"
            title="Add Members"
            ng-reflect-color="primary"
        >
            Add Members
        </button>
        <button
            type="button"
            (click)="modal.close('Remove Members'); removeMembers()"
            mat-raised-button
            color="primary"
            aria-hidden="false"
            class="refset-tool-action-button"
            aria-label="Remove Members"
            title="Remove Members"
            ng-reflect-color="primary"
            style="margin-left: 15px"
        >
            Remove Members
        </button>
    </div>
</ng-template>
