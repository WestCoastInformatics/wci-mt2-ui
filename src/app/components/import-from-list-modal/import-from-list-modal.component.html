<button title="Import List of SctIds" aria-label="Import list" class="rt2-link-btn"
  (click)="openImportFromListModal(importFromListDialog)">
  Add/Remove by List</button>

<ng-template #importFromListDialog let-modal>

  <div class="modal-header rt2-modal-header">
    <button class="unfocus-btn"></button>
    <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
      Add or Remove Members By List
    </h4>

    <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true" class="dialog-close-x">&times;</span>
    </button>
  </div>

  <div class="modal-body rt2-lockable">

    <div class="container-fluid import-from-container-fluid">
      <div class="modal-body import-from-modal-body">

        <div class="import-from-label"> Enter a list of SCTIDs. Use a comma or whitespace delimited
          Concept Ids.</div>

        <mat-form-field floatLabel="never" class="import-from-list-field" appearance="legacy">
          <textarea matInput #listTextArea ngbAutofocus class="import-from-list-text-area" [(ngModel)]="listOfIds"></textarea>
        </mat-form-field>

      </div>
    </div>

  </div>

  <div class="modal-footer rt2-modal-footer rt2-lockable rt2-btn-group">

    <button type="button" (click)="callMemberOperation('add')" color="green" aria-hidden="false" class="rt2-btn rt2-next-back-btn" aria-label="Add Members"
      title="Add Members">
      Add Members
    </button>

    <button *ngIf="!isIntensional" type="button" (click)="callMemberOperation('remove')" color="red" aria-hidden="false"
      class="rt2-btn rt2-remove-btn" aria-label="Remove Members" title="Remove Members">
      Remove Members
    </button>

    <button type="button" (click)="modal.dismiss('Cross click')"  aria-hidden="false" class="rt2-btn rt2-close-btn" aria-label="Close">
      Close
    </button>

  </div>

</ng-template>
