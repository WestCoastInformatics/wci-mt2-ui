<button (click)="openImportFromListModal(importFromListDialog)" class="refset-tool-standard-icon-button">
    <img src="assets/import-list-upload-icon.svg" alt="Document symbol denoting an upload icon" title="Import List of SctIds" aria-label="Import list" />
</button>

<ng-template #importFromListDialog let-modal>

    <div class="modal-header import-from-modal-header">

        <h4 class="modal-title import-from-modal-title" id="modal-basic-title">
            Add or Remove Members By List
        </h4>

        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body refset-tool-lockable">
        
        <div class="container-fluid import-from-container-fluid">
            <div class="modal-body import-from-modal-body">

                <div class="import-from-label"> Enter a list of SctIds. Use a comma or whitespace delimited Concept Ids.</div>

                <mat-form-field class="import-from-list-field" appearance="outline">
                    <textarea matInput class="import-from-list-text-area" [(ngModel)]="listOfIds">test</textarea>
                </mat-form-field>

            </div>
        </div>

    </div>

    <div class="modal-footer import-from-modal-footer refset-tool-lockable">

        <button type="button" (click)="callMemberOperation('add')" mat-raised-button color="primary" aria-hidden="false" class="refset-tool-action-button" 
                aria-label="Add Members" title="Add Members" ng-reflect-color="primary">
            Add Members
        </button>

        <button *ngIf="!isIntensional" type="button" (click)="callMemberOperation('remove')" mat-raised-button color="primary" aria-hidden="false"
                class="refset-tool-action-button import-from-remove-members-button" aria-label="Remove Members" title="Remove Members" ng-reflect-color="primary">
            Remove Members
        </button>

    </div>
    
</ng-template>
