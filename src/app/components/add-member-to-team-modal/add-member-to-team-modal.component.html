<button class="rt2-btn rt2-action-btn float-right" (click)="openAddMemberModal(addMemberModal)">Add Existing User(s)</button>

<ng-template #addMemberModal let-modal>
	<div *ngIf="showLoadingSpinner" class="loading"></div>
	<div class="modal-header rt2-modal-header">
		<button ngbAutofocus class="unfocus-btn"></button>
		<h3 class="modal-title rt2-modal-title modal-header-font" id="modal-basic-title">Add User(s) to the "{{ name }}" {{ type }}</h3>

		<button type="button" class="close dialog-close-x cross-icon-font" aria-label="Close" (click)="modal.dismiss('Cross click')">
			<span aria-hidden="true" class="dialog-close-x cross-icon-font">&times;</span>
		</button>
	</div>
	<div class="modal-body rt2-lockable">
		<table *ngIf="users?.length < 1">
			<tr>
				<td>
					<span class="m-t-20 m-b-20"> There are no users or all users have already been added to this team. </span>
				</td>
			</tr>
		</table>
		<table *ngIf="users?.length > 0">
			<tr>
				<td>
					<span class="field-text">Only users that have already been added to this organization can be added to this team.</span>
				</td>
			</tr>
			<tr>
				<td>
					<mat-form-field floatLabel="never" appearance="fill" class="team-member-form-field">
						<mat-label>Choose User(s) to Add</mat-label>
						<mat-select multiple [(ngModel)]="emails" [disableOptionCentering]="true" class="team-member-select">
							<mat-option class="team-member-select-option" *ngFor="let user of users" [value]="user.email">
								<span class="text-lowercase">
									{{ user.email }}
								</span>
							</mat-option>
						</mat-select>
					</mat-form-field>
				</td>
			</tr>
			<tr class="modal-error-message" [hidden]="!emailError">
				<div>{{ emailError }}</div>
			</tr>
		</table>
	</div>
	<div class="modal-footer rt2-modal-footer rt2-lockable rt2-btn-group">
		<button (click)="addUsersToTeam()" [disabled]="emails?.length < 1" class="rt2-btn rt2-next-back-btn">Add User(s)</button>
		<button
			type="button"
			(click)="modal.dismiss('Cross click')"
			aria-hidden="false"
			class="rt2-btn rt2-cancel-btn"
			aria-label="Cancel"
			title="Cancel"
		>
			Cancel
		</button>
	</div>
</ng-template>
