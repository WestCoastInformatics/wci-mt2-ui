<button *ngIf="isInitialUpgrade" type="button" mat-raised-button color="primary" aria-hidden="false" #upgradeButton class="refset-tool-action-button refset-action-button" (click)="openUpgradeModal(upgradeDialog)" aria-label="Upgrade" title="Upgrade" ng-reflect-color="primary">
    Upgrade
</button>
<adjudicate-upgrade-modal *ngIf="!isInitialUpgrade" [refsetData]="refsetData" [membersOfRefset]="membersOfRefset" [membersInCommon]="membersInCommon" [inactiveConcepts]="inactiveConcepts"></adjudicate-upgrade-modal>
<ng-template #upgradeDialog
             let-modal>
<ng-container>
    <div class="modal-header rt2-modal-header">
        <h4 class="modal-title rt2-modal-title"
            id="modal-basic-title">
            Upgrade Reference Set
        </h4>
        <button type="button"
                class="close dialog-close-x"
                aria-label="Close"
                (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="container-fluid upgrade-container-fluid">
        <div class="modal-body upgrade-modal-body">
            <div class="upgrade-modal-body-header">
                <div class="upgrade-modal-current-version">
                    <span class="upgrade-modal-current-version-label" aria-label="Current Version:">Current Version:</span>
                    <span class="upgrade-modal-current-version-term">{{latestDate(refsetData?.versionList)}}</span>
                </div>
                <div class="upgrade-modal-current-terminology">
                    <span class="upgrade-modal-current-terminology-label" aria-label="Current Terminology:">Current Terminology:</span>
                    <span class="upgrade-modal-current-terminology-term">{{refsetData?.editionShortName}}</span>
                </div>
            </div>
            <div class="upgrade-modal-body-mid">
            <div><span class="upgrade-modal-body-mid-label">Upgrade To: </span>{{ existingBranchVersions[0] + ' (PUBLISHED)' }}</div>
            </div>
        </div>
    </div>
    <div class="modal-footer rt2-modal-footer">
        <button type="button" mat-raised-button color="green" aria-hidden="false" class="refset-tool-action-button upgrade-modal-button" aria-label="Upgrade" title="Upgrade" ng-reflect-color="green" (click)="modal.dismiss('Cross click'); upgrade()">
            Upgrade
        </button>
    </div>
</ng-container>
</ng-template>
