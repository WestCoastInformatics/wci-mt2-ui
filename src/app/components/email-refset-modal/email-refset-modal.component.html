<button class="rt2-picklist-btn" alt="Share Reference Set" title="Share Reference Set" aria-label="Share Reference Set" (click)="openEmailRefsetModal(emailRefsetDialog)">Share
  Reference Set</button>

<ng-template #emailRefsetDialog let-modal>

  <div class="modal-header rt2-modal-header">

    <h4 class="modal-title rt2-modal-title modal-header-font" id="modal-basic-title">
      Share Reference Set: {{refset?.name}}
    </h4>

    <button type="button" class="close dialog-close-x close-icon-font" aria-label="Close" (click)="modal.dismiss('Cross click');reset();">
      <span aria-hidden="true" class="dialog-close-x close-icon-font">&times;</span>
    </button>
  </div>

  <div class="modal-body rt2-lockable">
    <label class="modal-label-description">Send someone an email with a link to this Reference
      Set</label>
    <table>

      <tr>
        <td>
          <label class="modal-label">Email: <span class="mandatory-field">*</span></label>
        </td>
        <td>
          <input class="modal-input-field w-250 p-b-9" (keydown.tab)="onKeyDownEvent($event)" ngbAutofocus placeholder="primarycontactemail@orgname.org" [(ngModel)]="email" />


        </td>
      </tr>
      <tr class="modal-error-message" [hidden]="!emailError">
        <div>{{emailError}}</div>
      </tr>
      <tr>
        <td>
          <label class="modal-label-description">Message:</label>
        </td>
        <td>
          <mat-form-field floatLabel="never" class="import-from-list-field" appearance="legacy">
            <textarea matInput class="import-from-list-text-area" [(ngModel)]="description">test</textarea>
          </mat-form-field>

        </td>
      </tr>
    </table>

  </div>
  <div class="modal-footer rt2-modal-footer rt2-lockable">
    <button type="button" [disabled]="email === '' || !isValidEmail()" (click)="emailRefsetObject()" color="green" aria-hidden="false"
      class="rt2-btn rt2-next-back-btn" aria-label="Send Email" title="Send Email">
      Send Email
    </button>
    <button type="button" (click)="modal.dismiss('Cross click')" aria-hidden="false" 
      class="rt2-btn rt2-cancel-btn" aria-label="Cancel" title="Cancel">
      Cancel
    </button>
  </div>

</ng-template>
