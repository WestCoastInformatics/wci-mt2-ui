<button mat-menu-item alt="Document symbol denoting an upload icon" title="Import Concepts from ECL" aria-label="Import Concepts from ECL" (click)="openImportFromEclModal(importFromEclDialog)">ECL Builder</button>

<ng-template #importFromEclDialog let-modal>

    <div class="modal-header import-from-modal-header">

        <h4 class="modal-title import-from-modal-title" id="modal-basic-title">
            Add or Remove Members By ECL
        </h4>

        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body refset-tool-lockable">
        
        <div class="container-fluid import-from-container-fluid">
            <div class="modal-body import-from-modal-body">

                <div class="import-from-label import-from-ecl-label"> Enter a valid ECL statement or use the ECL Builder.</div>

                <mat-form-field class="import-from-ecl-field" appearance="outline">
                    <textarea id="importFromEclInput" matInput class="import-from-ecl-text-area" [(ngModel)]="ecl"></textarea>
                </mat-form-field>

                <button (click)="openEclBuilder('importFromEclInput')" class="refset-tool-standard-icon-button refset-tool-search-ecl-button">
                    <img src="assets/wrench-icon.svg" alt="wrench icon" title="Open ECL Builder" aria-label="ECL Builder" />
                </button>

            </div>
        </div>

    </div>

    <div class="modal-footer import-from-modal-footer refset-tool-lockable">

        <button type="button" (click)="callMemberOperation('add')" mat-raised-button color="primary" aria-hidden="false" class="refset-tool-action-button" 
                aria-label="Add Members" title="Add Members" ng-reflect-color="primary">
            Add Members
        </button>

        <button *ngIf="!isIntensional" type="button" (click)="callMemberOperation('remove')" mat-raised-button color="primary" aria-hidden="false"
                class="refset-tool-action-button import-from-remove-members-button" aria-label="Remove Members" title="Remove Members" ng-reflect-color="primary">
            Remove Members
        </button>

    </div>
    
</ng-template>
