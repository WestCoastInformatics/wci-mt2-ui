<button *ngIf="isDetailPage && refset!=null && project==null && !disableDownload" mat-button class="manage-refset-menu"
    title="Download Reference Set" aria-label="Download Reference Set"
    (click)="openDownload(refset.refsetId)">Download
</button>
<button *ngIf="disableDownload" [title]="disableTitle" mat-button class="manage-refset-menu disable-menu-btn">
    Download
</button>

<button *ngIf="!isDetailPage && refset!=null && project==null" mat-icon-button aria-hidden="false" (click)="openDownload(refset.refsetId)" aria-label="Download Reference Set" title="Download Reference Set"
  class="refset-tool-table-action-icon {{buttonClasses}}" [ngClass]="{inactive: disabled}" [disabled]="disabled">
    <span class="mat-button-wrapper">
        <mat-icon role="img" class="mat-icon notranslate material-icons mat-icon-no-color" aria-hidden="true" data-mat-icon-type="font">download</mat-icon>
    </span>
    <span matripple="" class="mat-ripple mat-button-ripple mat-button-ripple-round"></span>
    <span class="mat-button-focus-overlay"></span>
</button>

<a *ngIf="project!=null && refsets!=null" aria-hidden="false"
   class='btn btn-primary rounded btn-lg btn-wide-font mr-3' style="width: 160px"
    title="Download All Refsets for Project"
	aria-label="Download All Refsets for Project"  (click)="openProjectRefsetDownload(project, refsets)">
	Bulk Download
</a>

<ng-template #refsetDownloadDialog let-data>
    <div class="container-fluid download-modal-container">
        <div class="row" id="downloadFormatRow">
            <div class="col refset-tool-download-column-label">
                <label>Format:</label>
            </div>
            <div class="col refset-tool-download-column-field">
                <mat-form-field floatLabel="never" appearance="legacy">
                    <mat-select #downloadFormatField [(value)]="data.selectedFormat" (selectionChange)="changeFormat(data)">
                        <mat-option *ngFor="let option of data.formatOptions" [value]="option.value">
                            {{ option.display }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

        <div class="row" id="downloadContentRow" *ngIf="showContent">
            <div class="col refset-tool-download-column-label">
                <label>Content:</label>
            </div>
            <div class="col refset-tool-download-column-field">
                <mat-form-field floatLabel="never" appearance="legacy">
                    <mat-select #downloadContentField [(value)]="data.selectedContent" (selectionChange)="changeContent(data)">
                        <ng-container *ngFor="let option of data.contentOptions">
                            <mat-option *ngIf="checkContentValues(data, option)" [value]="option.value">
                                {{ option.display }}
                            </mat-option>
                        </ng-container>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row" id="downloadContentRow" *ngIf="showVersions && !shouldShowDeltaContentLabel() && showDeltaOption(data)">
            <div class="col refset-tool-download-column-label"></div>
            <div class="col refset-tool-download-column-field">
                *Delta option not available as this is the initial version of the refset
            </div>
        </div>

        <div class="row" id="downloadLanguageRow" *ngIf="showLanguages">
            <div class="col refset-tool-download-column-label">
                <label>Language Reference Set:</label>
            </div>
            <div class="col refset-tool-download-column-field">
                <mat-form-field floatLabel="never" appearance="legacy">
                    <mat-select #downloadLanguageField [(value)]="data.selectedLanguage">
                        <mat-option *ngFor="let option of data.languageOptions" [value]="option.value">
                            {{ option.display }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

        <div class="row" id="downloadVersionRow" *ngIf="showVersions">
            <div class="col refset-tool-download-column-label">
                <label>Version:</label>
            </div>
            <div class="col refset-tool-download-column-field">
                <input class="version-input-placeholder" placeholder="{{addSpaceAfterVersionDate(data.selectedVersion)}}" name="name" disabled />
            </div>
        </div>

        <div class="row" id="downloadComparisonRow" *ngIf="showComparison && shouldShowDeltaContentLabel()">

            <div class="col refset-tool-download-column-label">
                <label>Delta Comparison:</label>
            </div>

            <div class="col refset-tool-download-column-field">
                <div class="row delta-row">
                    <div class="ml-3"><label class="in-form-label">From:</label></div>

                    <mat-form-field floatLabel="never" appearance="legacy" class="delta-select">
                        <mat-select #downloadComparisonFromField [(value)]="data.selectedComparisonFrom" (selectionChange)="changeComparisonFrom(data)">
                            <mat-option *ngFor="let option of data.comparisonFromOptions" [value]="option.value">
                                {{ addSpaceAfterVersionDate(option.display) }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <div><label class="in-form-label">To:</label></div>
                    <input class="delta-input-placeholder" placeholder="{{addSpaceAfterVersionDate(data.selectedComparisonTo)}}" name="name" disabled />
                </div>
            </div>

        </div>

        <div class="row" id="downloadMetaDataRow" *ngIf="showContent || showMetadata">
            <div class="col refset-tool-download-column-label">
                <label>Include Metadata:</label>
            </div>
            <div class="col refset-tool-download-column-field">
                <mat-checkbox [(ngModel)]="data.exportMetadata" value="true"></mat-checkbox>
            </div>
        </div>
    </div>
</ng-template>
