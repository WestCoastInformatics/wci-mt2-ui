        <div class="my-organizations-text" *ngIf="!toggleService.isToggled">

    <div
        class="my-teams"
        [routerLink]="['/myteams']"
        [routerLinkActive]="['active']"
    >
        <div class="my-teams-icon">
            <svg
                id="my-teams-icon"
                data-name="icon / settings / colleagues"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
            >
                <path
                    id="Vector-2"
                    data-name="Vector"
                    d="M14.5,7A2.5,2.5,0,1,0,12,4.5,2.492,2.492,0,0,0,14.5,7ZM7,6A3,3,0,1,0,4,3,2.987,2.987,0,0,0,7,6Zm7.5,3C12.67,9,9,9.92,9,11.75V14H20V11.75C20,9.92,16.33,9,14.5,9ZM7,8C4.67,8,0,9.17,0,11.5V14H7V11.75A3.941,3.941,0,0,1,9.37,8.28,12.283,12.283,0,0,0,7,8Z"
                    transform="translate(2 5)"
                    fill="#90a0b7"
                />
            </svg>
        </div>
        <div class="my-teams-text" *ngIf="!toggleService.isToggled">
            Project Settings
        </div>
    </div>
    <div class="my-settings"></div>
    <div class="fill-space-2"></div>
    <div class="toggle-sidebar" (click)="toggleService.toggleSidebar()">
        <div class="my-toggle-icon" *ngIf="!toggleService.isToggled">
            <svg
                id="my-toggle-icon"
                data-name="icon / menu / toggle"
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 14 14"
            >
                <path
                    id="Subtract"
                    d="M12,14H2a2,2,0,0,1-2-2V2A2,2,0,0,1,2,0H12a2,2,0,0,1,2,2V12A2,2,0,0,1,12,14ZM5,2A1,1,0,0,0,4,3v8a1,1,0,0,0,2,0V3A1,1,0,0,0,5,2Z"
                    fill="#90a0b7"
                />
            </svg>
        </div>
        <div class="my-toggle-icon" *ngIf="toggleService.isToggled">
            <svg
                id="my-toggle-icon"
                data-name="icon / menu / toggle"
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 14 14"
            >
                <path
                    id="Subtract"
                    d="M12,14H2a2,2,0,0,1-2-2V2A2,2,0,0,1,2,0H12a2,2,0,0,1,2,2V12A2,2,0,0,1,12,14ZM5,2A1,1,0,0,0,4,3v8a1,1,0,0,0,2,0V3A1,1,0,0,0,5,2Z"
                    fill="rgb(0, 164, 228)"
                />
            </svg>
        </div>
        <div class="my-toggle-text" *ngIf="!toggleService.isToggled">
            Toggle Sidebar
        </div>
    </div>
</div>
