<div class="limit-text-container">
    <span *ngIf="(shortText)" class="limit-text-30"
        [innerHTML]="shortText"
        (click)="openCreateRefsetModal(refsetVersionNotes)">
    </span>
</div>

<ng-template #refsetVersionNotes let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">
            {{ title }}
        </h4>
        <button
            type="button"
            class="close"
            aria-label="Close"
            (click)="modal.dismiss('Cross click')"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="container-fluid">
        <div class="modal-body">
            <div class="row" [innerHTML]="longText"></div>
        </div>
    </div>
    <div class="modal-footer">
        <button
            type="button"
            (click)="modal.close('Read Only Text Modal')"
            mat-raised-button
            color="primary"
            aria-hidden="false"
            class="refset-tool-action-button"
            aria-label="Read Only Text Modal"
            title="Read Only Text Modal"
            ng-reflect-color="primary"
        >
            Close
        </button>
    </div>
</ng-template>
