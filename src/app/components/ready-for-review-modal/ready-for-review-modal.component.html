<button
    #readyForReviewButton
    (click)="openreadyForReviewModal(readyForReviewDialog)"
    mat-raised-button
    color="primary"
    aria-hidden="false"
    #finishEditButton
    class="refset-tool-action-button request-review-button"
    aria-label="Request Review"
    title="Request Review"
    ng-reflect-color="primary"
>
    Request Review
</button>

<ng-template #readyForReviewDialog let-modal>
    <div class="modal-header ready-for-review-modal-header">
        <h4
            class="modal-title ready-for-review-modal-title"
            id="modal-basic-title"
        >
            Ready for Review
        </h4>
        <button
            type="button"
            class="close"
            aria-label="Close"
            (click)="modal.dismiss('Cross click')"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="container-fluid ready-for-review-container-fluid">
        <div class="modal-body ready-for-review-modal-body">
            <div class="notes-title">Notes:</div>
            <editor
                [(ngModel)]="requestForReviewNotes"
                [init]="{
                    base_url: '/tinymce',
                    suffix: '.min',
                    height: 200,
                    menubar: false,
                    placeholder: 'Notes for review consideration.',
                    plugins: ['lists advlist'],
                    toolbar:
                        'undo redo | bold italic | bullist numlist outdent indent'
                }"
            ></editor>
        </div>
    </div>
    <div class="modal-footer ready-for-review-footer">
        <button
            type="button"
            (click)="modal.close('Request Review')"
            mat-raised-button
            color="primary"
            aria-hidden="false"
            class="refset-tool-action-button request-review-modal-button"
            aria-label="Request Review"
            title="Request Review"
            ng-reflect-color="primary"
        >
            Request Review
        </button>
    </div>
</ng-template>
