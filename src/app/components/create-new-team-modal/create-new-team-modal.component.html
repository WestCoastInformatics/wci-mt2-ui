  (click)="openCreateNewTeamModal(createNewTeamDialog)">Create New
  Team</a> -->
<button title="Create New Team" class="rt2-btn rt2-action-btn float-right mt-1" aria-label="Create New Team" (click)="openCreateNewTeamModal(createNewTeamDialog)">
  Create New Team
</button>


<ng-template #createNewTeamDialog let-modal>

  <div class="modal-header rt2-modal-header">
    <button ngbAutofocus class="unfocus-btn"></button>
    <h3 class="modal-title rt2-modal-title modal-header-font" id="modal-basic-title">
      Create New Team
    </h3>

    <button type="button" class="close dialog-close-x close-icon-font" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true" class="dialog-close-x close-icon-font">&times;</span>
    </button>
  </div>

  <div class="modal-body rt2-lockable">

    <table>
      <tr *ngIf="!param">
        <td>
          <label class="modal-label-edition p-t-6">Parent Organization:</label>
        </td>
        <td>
          {{ organization.name }}
        </td>
      </tr>
      <tr>
        <td>
          <label class="modal-label">Name: <span class="mandatory-field">*</span></label>
        </td>
        <td>
          <input class="modal-input-field w-250 p-b-7" placeholder="Team Name" #teamName [(ngModel)]="name" />{{ setAutoFocus(teamName) }}
        </td>
      </tr>
      <tr>
        <td>
          <label class="modal-label">Email:</label>
        </td>
        <td>
          <input class="modal-input-field w-250 p-b-7" (keydown.tab)="onKeyDownEvent($event)" placeholder="primarycontactemail@orgname.org" [(ngModel)]="email" />
        </td>
      </tr>
      <tr class="modal-error-message" [hidden]="!emailError">
        <div>{{emailError}}</div>
      </tr>
      <tr>
        <td>
          <label class="modal-label-description">Description:</label>
        </td>
        <td>
          <mat-form-field floatLabel="never" class="import-from-list-field" appearance="legacy">
            <textarea matInput class="import-from-list-text-area" [(ngModel)]="description">test</textarea>
          </mat-form-field>

        </td>
      </tr>
      <tr>
        <td>
          <label class="modal-label p-t-9">Role: <span class="mandatory-field">*</span></label>
        </td>
        <td>
          <mat-form-field floatLabel="never" appearance="legacy" class="default-font">
            <mat-select #detailsLanguageSelect placeholder="Choose role(s) to apply to this Team" [ngModel]="roleOptions" [(value)]="selectedRoles" multiple
              class="rt2-modal-select" panelClass="rt2-modal-panel" (selectionChange)="setRoles()">

              <mat-option *ngFor="let role of roleOptions" [value]="role.value">
                {{role.display}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </td>
      </tr>
    </table>

  </div>

  <div class="modal-footer rt2-modal-footer rt2-lockable rt2-btn-group">
    <button type="button" [disabled]="name === '' || !isValidEmail() || selectedRoles.length === 0" (click)="createTeamObject()" color="green"
      aria-hidden="false" class="rt2-btn rt2-next-back-btn" aria-label="Create Team" title="Create Team">
      Create Team
    </button>
    <button type="button" (click)="modal.dismiss('Cross click')" aria-hidden="false" 
       class="rt2-btn rt2-cancel-btn" aria-label="Cancel" title="Cancel" >
      Cancel
    </button>
  </div>

</ng-template>
