<a *ngIf="!param && canAdd" title="Create New Team" class='btn btn-primary rounded btn-lg'
    aria-label="Create New Team" (click)="openCreateNewTeamModal(createNewTeamDialog)">Create New Team</a>
<a *ngIf="param && canAdd" class="btn btn-primary rounded radius-0 float-right" title="Create New Team"
    aria-label="Create New Team" (click)="openCreateNewTeamModal(createNewTeamDialog)">Create New Team</a>

<ng-template #createNewTeamDialog let-modal>

    <div class="modal-header rt2-modal-header">

        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
            Create New Team
        </h4>

        <button type="button" class="close dialog-close-x" aria-label="Close"
            (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>

    <div class="modal-body refset-tool-lockable">

        <table>
            <tr *ngIf="!param">
                <td>
                    <label class="modal-label pt-6p">Parent Organization: <span class="mandatory-field">*</span></label>
                </td>
                <td>
                    <div class="row" id="downloadContentRow">
                        <div>
                            <mat-form-field appearance="fill" class="col refset-tool-modal-select-field">
                                <mat-select #downloadContentField class="refset-tool-modal-select" [(value)]="selectedOrganization">
                                    <mat-option *ngFor="let option of organizations" [value]="option">{{ option.name }}</mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <label class="modal-label">Name: <span class="mandatory-field">*</span></label>
                </td>
                <td>
                    <input class="modal-input-field profile-field" placeholder="Team Name" [(ngModel)]="name" />
                </td>
            </tr>
            <tr>
                <td>
                    <label class="modal-label">Email:</label>
                </td>
                <td>
                    <input class="modal-input-field profile-field" (keydown.tab)="onKeyDownEvent($event)" placeholder="primarycontactemail@orgname.org" [(ngModel)]="email" />
                </td>
            </tr>
            <tr class="modal-error-message" [hidden]="!emailError">
                <div>{{emailError}}</div>
            </tr>
            <tr>
                <td>
                    <label class="modal-label">Description:</label>
                </td>
                <td>
                    <mat-form-field class="import-from-list-field" appearance="outline">
                        <textarea matInput class="import-from-list-text-area" [(ngModel)]="description">test</textarea>
                    </mat-form-field>

                </td>
            </tr>
            <tr>
                <td>
                    <label class="modal-label pt-6p">Role: <span class="mandatory-field">*</span></label>
                </td>
                <td>
                    <mat-form-field appearance="fill" class="refset-tool-modal-select-field">
                        <mat-select #detailsLanguageSelect
                            placeholder="Choose role(s) to apply to this team"
                            [ngModel]="roleOptions" [(value)]="selectedRoles" multiple
                            class="refset-tool-modal-select" panelClass="refset-tool-modal-panel"
                            (selectionChange)="setRoles()">

                            <mat-option *ngFor="let role of roleOptions" [value]="role.value">
                                {{role.display}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </td>
            </tr>
        </table>

    </div>

    <div class="modal-footer rt2-modal-footer refset-tool-lockable">
        <button type="button" [disabled]="name === '' || description === '' || email === ''  || !isValidEmail() || selectedRoles.length === 0"
            (click)="callMemberOperation()" mat-raised-button color="green" aria-hidden="false"
            class="refset-tool-action-button" aria-label="Create Team" title="Create Team"
            ng-reflect-color="green">
            Create Team
        </button>
    </div>

</ng-template>
