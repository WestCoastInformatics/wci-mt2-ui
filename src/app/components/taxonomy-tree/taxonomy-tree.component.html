<div *ngIf="showLoadingSpinner" class="loading">Loading&#8230;</div>

<div class="container-fluid refset-tool-taxonomy" style="margin-left: -30px; height: fit-content;">
    <div class="row" *ngIf="isLoading">
        <div>Loading...</div>
    </div>

    <div class="row" *ngIf="noData">
        <div>No children</div>
    </div>

    <tree-root
        [id]="treeId"
        [nodes]="nodes"
        [options]="configOptions"
        (activate)="configOptions.onSelect($event)"
        (updateData)="onInitTree($event)"
        (loadNodeChildren)="onLoadNodeChildren($event)"
>
        <ng-template #treeNodeTemplate let-node let-index="index">
            <ng-container *ngIf="editMode">
                <img
                [hidden]="node?.data.memberOfRefset"
                src="assets/add-symbol-icon.svg"
                (click)="addRemoveConcept(true, node?.data)"
                width="18px"
                height="18px"
                title="Add Member"
                aria-label="Add"
                class="add-symbol-icon"
                alt="Add symbol shown when you're able to add a concept"
            />
            <img
                [hidden]="!node?.data.memberOfRefset"
                src="assets/subtract-symbol-icon.svg"
                (click)="addRemoveConcept(false, node?.data)"
                width="18px"
                height="18px"
                title="Remove Member"
                aria-label="Subtract"
                class="subtract-symbol-icon"
                alt="Subtract symbol shown when you're able to remove a concept"
            />
            </ng-container>
            <img
                *ngIf="node.data.defined"
                title="Fully Defined"
                aria-label="Fully Defined"
                src="/assets/linedTaxonomyIcon.png"
            />
            <img
                *ngIf="!node.data.defined"
                title="Primitive"
                aria-label="Primitive"
                src="/assets/unlinedTaxonomyIcon.png"
            />
            <span
                id="{{ node?.parent?.data?.code + '-' + node?.data?.code }}"
                class="taxonomy-code-text"
                [class.bold-if-member]="node?.data?.memberOfRefset && editMode"
                [class.greyed-if-not-member]="!node?.data?.memberOfRefset && editMode"
                (dblclick)="sendConceptDetailTrigger(node.data);"
                title="{{ getNodeText(node) }}"
                aria-label="{{ getNodeText(node) }}"
                >{{ getNodeText(node) }}</span
            >
        </ng-template>
    </tree-root>
</div>
<add-remove-concepts [isAdd]="isAdd" [conceptCode]="conceptForAddRemove?.code" [conceptName]="conceptForAddRemove?.name" [conceptHasChildren]="conceptForAddRemove?.hasChildren" 
    [refsetInternalId]="refset?.id" (sendLoadingSpinnerTrigger)="sendLoadingSpinnerTrigger($event)" (processChangedMemberEffects)="processChangedMemberEffects()">
</add-remove-concepts>
<scroll-top></scroll-top>
