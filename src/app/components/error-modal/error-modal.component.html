<div class="modal-header mt2-modal-header">
	<div class="modal-title">Error</div>
	<button type="button" class="close dialog-close-x close-icon-font" title="Close" aria-label="Close" (click)="activeModal.close()">
		<span aria-hidden="true">&times;</span>
	</button>
</div>
<div class="modal-body m-t-20">
	<p>{{ summary }}</p>
	@if (items.length > 0) {
		<p class="m-b-0">Total: {{ items.length }}</p>
		<ul class="scroll">
			@for (item of items; track $index) {
				<li>{{ item }}</li>
			}
		</ul>
	}
</div>
<div class="modal-footer mt2-modal-footer mt2-lockable mt2-btn-group">
	<button type="button" class="mt2-btn mt2-action-btn" (click)="activeModal.close()">OK</button>
</div>
