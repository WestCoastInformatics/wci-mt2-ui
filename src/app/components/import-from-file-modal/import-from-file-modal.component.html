<button
    #importFromFileButton
    (click)="openImportFromFileModal(importFromFileDialog)"
    class="import-from-file-button"
>
    <img
        src="assets/import-file-upload-icon.svg"
        alt="Document symbol denoting an upload icon"
        title="Import file"
        aria-label="Import file"
    />
</button>

<div *ngIf="showLoadingSpinner" class="loading">Loading&#8230;</div>

<ng-template #importFromFileDialog let-modal>
    <div class="modal-header import-from-file-modal-header">
        <h4
            class="modal-title import-from-file-modal-title"
            id="modal-basic-title"
        >
            Add or Remove members From File
        </h4>
        <button
            type="button"
            class="close"
            aria-label="Close"
            (click)="modal.dismiss('Cross click')"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="container-fluid import-from-file-container-fluid">
        <div class="modal-body import-from-file-modal-body">
            <mat-form-field
                appearance="fill"
                class="import-from-file-drop-down"
            >
                <select matNativeControl>
                    <option value="rf2">Import RF2</option>
                    <option value="rf2list">Import List of SctIds</option>
                </select>
            </mat-form-field>
            <div
                class="container-file-import"
                dragAndDrop
                (fileDropped)="onFileDropped($event)"
            >
                <input
                    type="file"
                    #fileDropRef
                    id="fileDropRef"
                    multiple
                    (change)="fileBrowseHandler($event.target.files)"
                />
                <img
                    src="assets/import-file-upload-icon2.svg"
                    alt="Document symbol denoting an upload icon"
                    title="Import file"
                    aria-label="Import file"
                />

                <h3>Drag and drop file here</h3>
                <h3>or</h3>
                <label
                    for="fileDropRef"
                    class="import-from-file-drop-down-label"
                    >Browse for file</label
                >
            </div>
            <div class="files-list-file-import">
                <div
                    class="single-file"
                    *ngFor="let file of files; let i = index"
                >
                    <div class="file-icon">
                        <img
                            src="assets/doc-upload-icon.svg"
                            alt="Document symbol denoting an uploaded file"
                        />
                    </div>
                    <div class="info">
                        <h4 class="name">
                            {{ file?.name }}
                        </h4>
                        <p class="size">
                            {{ formatBytes(file?.size) }}
                        </p>
                        <app-progress
                            [progress]="file?.progress"
                        ></app-progress>
                    </div>

                    <div class="delete" (click)="deleteFile(i)">
                        <img
                            src="assets/doc-delete-icon.svg"
                            alt="Document symbol denoting a trash can to delete files"
                            title="Delete file"
                            aria-label="Delete file"
                        />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer import-from-file-modal-footer">
        <button
            type="button"
            (click)="modal.close('Upgrade Members'); addMembers()"
            mat-raised-button
            color="primary"
            aria-hidden="false"
            class="refset-tool-action-button"
            aria-label="Add Members"
            title="Add Members"
            ng-reflect-color="primary"
        >
            Add Members
        </button>
        <button
            type="button"
            (click)="modal.close('Upgrade Members'); removeMembers()"
            mat-raised-button
            color="primary"
            aria-hidden="false"
            class="refset-tool-action-button"
            aria-label="Remove Members"
            title="Remove Members"
            ng-reflect-color="primary"
            style="margin-left: 15px"
        >
            Remove Members
        </button>
    </div>
</ng-template>
