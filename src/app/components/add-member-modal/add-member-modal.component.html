<a class='btn btn-primary rounded btn-lg float-right btn-wide-font' (click)="openAddMemberModal(addMemberModal)">Add User</a>

<ng-template #addMemberModal let-modal>
  <div *ngIf="showLoadingSpinner" class="loading"></div>
  <div class="modal-header rt2-modal-header">
    <button ngbAutofocus class="unfocus-btn"></button>
    <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
      Add User(s) to the "{{ name }}" {{ type }}
    </h4>

    <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true" class="dialog-close-x">&times;</span>
    </button>
  </div>

  <div class="modal-body refset-tool-lockable">
    <table>
      <tr *ngIf="type!=='Team'">
        <td>
          <mat-form-field floatLabel="never" appearance="legacy" class="email-input-field">
            <mat-label>Enter the email of the user to add:</mat-label>
            <input matInput (keydown)="onKeyDownEvent($event)" #addMember placeholder="user-email@orgname.org" [(ngModel)]="email" />
            {{ setAutoFocus(addMember) }}
          </mat-form-field>
        </td>
      </tr>
      <tr *ngIf="type=='Team'">
        <td>
            <mat-form-field floatLabel="never" appearance="legacy" class="team-member-form-field">
                <mat-label>Choose User(s) to Add</mat-label>
                <mat-select multiple [(ngModel)]="emails" [disableOptionCentering]="true" class="team-member-select">
                    <mat-option class="team-member-select-option" *ngFor="let user of users" [value]="user.email" >
                        {{ user.email }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </td>
      </tr>
      <tr class="modal-error-message" [hidden]="!emailError">
        <div>{{emailError}}</div>
      </tr>
    </table>
  </div>

  <div class="modal-footer rt2-modal-footer refset-tool-lockable">
    <button (click)="addUsersAsMembers()" [disabled]="(email === '' || !validEmail) && emails?.length < 1" mat-raised-button class="refset-tool-action-button mat-green">
      Add User(s)
    </button>
    <button type="button" (click)="modal.dismiss('Cross click')" mat-raised-button aria-hidden="false"
      class="ml-3 refset-tool-action-button default-btn" aria-label="Cancel" title="Cancel">
      Cancel
    </button>
  </div>

</ng-template>
