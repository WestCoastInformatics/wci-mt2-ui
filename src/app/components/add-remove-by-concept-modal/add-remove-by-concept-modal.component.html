<button
    #addRemoveConceptHierarchyButton
    (click)="openAddRemoveModal(addRemoveConceptHierarchyModal)"
    class="add-remove-concept-hierarchy-modal-button"
>
    <img src="assets/mag-icon.svg" alt="magnifying glass icon" />
</button>

            id="modal-basic-title"
        >
            Add/Remove By Concept or Hierarchy
        </h4>
        <button
            type="button"
            class="close"
            aria-label="Close"
            (click)="modal.dismiss('Cross click')"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

            <div class="row">

                    <as-split direction="horizontal" gutterSize="4">
                        <as-split-area [size]="50" [minSize]="25">

                                <div

                                        add-remove-concept-hierarchy-modal-search-bar

                                >
                                    <mat-form-field
                                        id="addRemoveByConceptHierarchySearchInputField"
                                        class="
                                            add-remove-concept-hierarchy-modal-input-field
                                        "
                                    >
                                        <mat-label
                                            >Search by ID or Keyword</mat-label
                                        >
                                        <input
                                            matInput
                                            #addRemoveByConceptHierarchySearchInput
                                            id="addRemoveByConceptHierarchySearchInput"
                                            [(ngModel)]="searchInput"
                                            (keyup.enter)="
                                                onTableSearchChange()
                                            "
                                        />
                                    </mat-form-field>
                                    <span
                                        class="
                                            add-remove-concept-hierarchy-modal-cancel-search
                                        "
                                        (click)="clearSearch()"
                                        >&#10005;</span
                                    >
                                    <section class="add-remove-concept-hierarchy-modal-active-slider-section">
                                        <div class="add-remove-concept-hierarchy-modal-results-title">Search Results</div>
                                        <mat-slide-toggle
                                            class="add-remove-concept-hierarchy-modal-active-slider"
                                            [color]="color"
                                            [checked]="checked"
                                            [disabled]="disabled"
                                        >
                                            Display Active Concepts Only
                                        </mat-slide-toggle>
                                    </section>
                                </div>

                                <div
                                    class="
                                        add-remove-concept-hierarchy-modal-results-container
                                    "
                                >
                                    <div
                                        class="
                                            add-remove-concept-hierarchy-modal-table
                                        "
                                    >
                                        <table
                                            mat-table
                                            [dataSource]="dataSource"
                                            class="mat-elevation-z8"
                                        >
                                            <!--- Note that these columns can be defined in any order.
                                                  The actual rendered columns are set as a property on the row definition" -->

                                            <!-- Position Column -->
                                            <ng-container
                                                matColumnDef="addOrRemove"
                                            >
                                                <td
                                                    mat-cell
                                                    *matCellDef="let concept"
                                                >
                                                    {{ concept.position }}
                                                </td>
                                            </ng-container>

                                            <!-- Name Column -->
                                            <ng-container matColumnDef="name">
                                                <td
                                                    mat-cell
                                                    *matCellDef="let concept"
                                                >
                                                    {{ concept.name }}
                                                </td>
                                            </ng-container>

                                            <!-- Weight Column -->
                                            <ng-container
                                                matColumnDef="description"
                                            >
                                                <td
                                                    mat-cell
                                                    *matCellDef="let concept"
                                                >
                                                    {{ concept.weight }}
                                                </td>
                                            </ng-container>

                                            <tr
                                                mat-row
                                                *matRowDef="
                                                    let row;
                                                    columns: displayedColumns
                                                "
                                                class="
                                                    add-remove-concept-hierarchy-modal-results-row
                                                "
                                            ></tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
