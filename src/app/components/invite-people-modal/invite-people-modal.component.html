<!-- <a *ngIf="canInvite && organization" class='btn btn-primary rounded btn-lg float-right btn-wide-font mr-3'
        (click)="openModal(formDialog)">Invite To Join</a> -->
<button *ngIf="canInvite && organization" class="rt2-btn rt2-action-btn float-right" (click)="openModal(formDialog)">
    Invite To Join
</button>
<button class="rt2-picklist-btn" (click)="openModal(formDialog)" title="Invite to Participate" aria-label="Invite to Participate"
    *ngIf="canInvite && refset">
    Invite to Participate</button>

<ng-template #formDialog let-modal>
    <div class="modal-header rt2-modal-header">
        <button ngbAutofocus class="unfocus-btn"></button>
        <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
            {{modalTitle}}
        </h4>
        <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true" class="dialog-close-x">&times;</span>
        </button>
    </div>
    <div class="modal-body rt2-lockable">
        <label class="modal-label-description">Send someone an email invitation to join your Organization as a collaborator</label>
        <table>

            <tr>
                <td>
                    <label class="modal-label">Recipient Email: <span class="mandatory-field">*</span></label>
                </td>
                <td>
                    <input class="modal-input-field w-250 p-b-9" (keydown.tab)="onKeyDownEvent($event)" ngbAutofocus placeholder="primarycontactemail@orgname.org" [(ngModel)]="email" />
                </td>
            </tr>
            <tr class="modal-error-message" [hidden]="!emailError">
                <div>{{emailError}}</div>
            </tr>
            <tr>
                <td>
                    <label class="modal-label-description">Message:</label>
                </td>
                <td>
                    <mat-form-field floatLabel="never" class="import-from-list-field placeholder-wrap" appearance="legacy">
                        <textarea matInput class="import-from-list-text-area " [(ngModel)]="description" placeholder="Add an optional message for your invitation recipient"></textarea>
                    </mat-form-field>
                </td>
            </tr>
        </table>

    </div>
    <div class="modal-footer rt2-modal-footer rt2-lockable">
        <button type="button" [disabled]="email === '' || !isValidEmail()" (click)="sendInvitation()"
                color="green" aria-hidden="false" class="rt2-btn rt2-next-back-btn" aria-label="Send Email" title="Send Email">
            Send Email
        </button>
        <button type="button" (click)="modal.dismiss('Cross click')" aria-hidden="false" 
          class="rt2-btn rt2-cancel-btn" aria-label="Cancel" title="Cancel">
            Cancel
        </button>

    </div>
</ng-template>
