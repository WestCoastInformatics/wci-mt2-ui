<button class="rt2-btn rt2-action-btn float-right" (click)="openAddMemberModal(addMemberModal)">
    Add User
</button>

<ng-template #addMemberModal let-modal>
  <div *ngIf="showLoadingSpinner" class="loading"></div>
  <div class="modal-header rt2-modal-header">
    <button ngbAutofocus class="unfocus-btn"></button>
    <h4 class="modal-title rt2-modal-title" id="modal-basic-title">
      <span>
        Add User to the "{{ name }}" Organization
      </span>
    </h4>
    <button type="button" class="close dialog-close-x" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true" class="dialog-close-x">&times;</span>
    </button>
  </div>
  <div class="modal-body rt2-lockable">
    <table>
      <tr>
        <td>
          <mat-form-field floatLabel="never" appearance="legacy" class="email-input-field">
            <mat-label>Enter the email of the user to add:</mat-label>
            <input matInput (keydown)="onKeyDownEvent($event)" #addMember placeholder="user-email@orgname.org" [(ngModel)]="email" />
            {{ setAutoFocus(addMember) }}
          </mat-form-field>
        </td>
      </tr>
      <tr class="modal-error-message" [hidden]="!emailError">
        <div>{{emailError}}</div>
      </tr>
    </table>
  </div>
  <div class="modal-footer rt2-modal-footer rt2-lockable rt2-btn-group">
    <button (click)="addUserToOrganization()" [disabled]="email === '' || !validEmail" class="rt2-btn rt2-next-back-btn">
      Add User
    </button>
    <button type="button" (click)="modal.dismiss('Cross click')" aria-hidden="false"
      class="rt2-btn rt2-cancel-btn" aria-label="Cancel" title="Cancel">
      Cancel
    </button>
  </div>
</ng-template>
