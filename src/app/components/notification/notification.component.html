<button *ngIf="options.closeButton" (click)="remove()" class="toast-close-button" aria-label="Close">
    <span aria-hidden="true">&times;</span>
</button>

<div *ngIf="title" [class]="options.titleClass" [attr.aria-label]="title">
    {{ title }} <ng-container *ngIf="duplicatesCount">[{{ duplicatesCount + 1 }}]</ng-container>
</div>

<div *ngIf="message && options['url']" role="alert" aria-live="polite" [class]="options.messageClass">
    <a [href]="options['url']" [download]="options['download']" [id]="options['urlId']">{{message}}</a>
</div>

<div *ngIf="message && options.enableHtml && !options['url']" role="alert" aria-live="polite" [class]="options.messageClass" [innerHTML]="message">
</div>

<div *ngIf="message && !options.enableHtml" role="alert" aria-live="polite" [class]="options.messageClass" [attr.aria-label]="message">
    {{ message }}
</div>

<a *ngFor="let button of buttons" class="btn btn-sm button rt2-notification-button" (click)="action(button)">
    {{button.title}}
</a>

<div *ngIf="options.progressBar">
    <div class="toast-progress" [style.width]="width + '%'"></div>
</div>
