<!--<object  [src]="uiUtility.toTitleCase(params?.data?.workflowStatus)"> {{ params?.value}}</object>-->
<ng-container *ngIf="status === 'PUBLISHED'"><div class="published-projects-button">Published</div> </ng-container>
<ng-container *ngIf="status === 'READY_FOR_EDIT'">
	<div class="ready-for-edit-projects-button">Ready For Edit</div>
</ng-container>
<ng-container *ngIf="status === 'IN DEVELOPMENT'">
	<div class="in-edit-projects-button">In Development</div>
</ng-container>
<ng-container *ngIf="status === 'IN_EDIT'">
	<div class="in-edit-projects-button">In Edit</div>
</ng-container>
<ng-container *ngIf="status === 'NEW'">
	<div class="in-edit-projects-button">New</div>
</ng-container>
<ng-container *ngIf="status === 'IN_UPGRADE'">
	<div class="in-upgrade-projects-button">In Upgrade</div>
</ng-container>
<ng-container *ngIf="status === 'READY_FOR_REVIEW'">
	<div class="ready-for-review-projects-button">Ready For Review</div>
</ng-container>
<ng-container *ngIf="status === 'EDITING DONE'">
	<div class="ready-for-review-projects-button">Ready For Review</div>
</ng-container>
<ng-container *ngIf="status === 'IN_REVIEW'">
	<div class="in-review-projects-button">In Review</div>
</ng-container>
<ng-container *ngIf="status === 'REVIEW_COMPLETED'">
	<div class="review-completed-projects-button">Review Completed</div>
</ng-container>
<ng-container *ngIf="status === 'READY_FOR_PUBLICATION'">
	<div class="ready-for-publication-projects-button">Ready For Publication</div>
</ng-container>
<!-- FINISH_EDITING   Specialist submits for review → REVIEW_NEEDED
  START_REVIEW     Lead starts review            → REVIEW_IN_PROGRESS
  ACCEPT_REVIEW    Lead accepts review           → REVIEW_RESOLVED
  REJECT_REVIEW    Lead rejects review           → NEW -->
