name: Angular Source Automated Tests
on:
    push:
        branches:
            - develop # the primary branch
    pull_request:
        branches:
            - develop # the primary branch
jobs:
    run-jest-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Install Dependencies
              run: npm ci
            - name: Build Application
              run: npm run build
            - name: Run Jest Tests
              run: npm run test
    cypress-run:
        needs: run-jest-tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Run E2E tests
              uses: cypress-io/github-action@v6
              with:
                  browser: chrome
                  build: npm run build
                  start: npm run start
                  wait-on: 'http://localhost:4200'
